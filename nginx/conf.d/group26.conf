server {
    if ($host = group26.hp.edu.technet.howest.be) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        listen 80;
        server_name group26.hp.edu.technet.howest.be;
        return 301 https://$host$request_uri;


}

server {
        listen 443 ssl reuseport;
        server_name             group26.hp.edu.technet.howest.be;
    ssl_certificate /etc/letsencrypt/live/group26.hp.edu.technet.howest.be/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/group26.hp.edu.technet.howest.be/privkey.pem; # managed by Certbot
        ssl_protocols           TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers             HIGH:!aNULL:!MD5;


        root   /usr/share/nginx/group26/public;
        index index.html index.htm index.php;

        #Honeypots ---------------------------

        location = /admin {
                access_log /var/log/nginx/honeypot_access.log honeypot_json;
                rewrite ^ /admin.php last;
        }


        location = /admin.php {
                root /usr/share/nginx/honeypot;

                include fastcgi_params;
                fastcgi_pass unix:/run/php/php8.4-fpm.sock;
                fastcgi_param SCRIPT_FILENAME /usr/share/nginx/honeypot/admin.php;
        }

        # ------------------------------------

        location / {
                try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
                fastcgi_pass unix:/run/php/php8.4-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                include fastcgi_params;
                }


}